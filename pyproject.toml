[project]
name = "manifestival"
version = "0.1.0"
description = "Explorer un manifest IIIF et télécharger ses images avec des noms de fichiers parlants."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marjorie Burghart" }]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.gui-scripts]
manifestival = "manifestival.app:main"

[tool.setuptools.packages.find]
include = ["manifestival*"]

[tool.setuptools.package-data]
manifestival = ["i18n/*.json", "resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Les mêmes règles minimales que Varians : de vrais défauts seulement.
[tool.ruff.lint]
select = ["F", "E9", "B006", "B023"]
